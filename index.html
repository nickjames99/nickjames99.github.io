all;}input[type=text]{height:66px;}textarea:focus,input[type=text]:focus{border-color:rgba(168,85,247,.68);box-shadow:0 0 0 4px rgba(168,85,247,.10);}.controls{display:grid;gap:10px;margin-top:14px;}button{min-height:48px;border:1px solid rgba(168,85,247,.36);border-radius:13px;padding:0 18px;color:#f9f4ff;background:linear-gradient(180deg,#2a203d,#1b1727);font-weight:950;cursor:pointer;transition:transform .15s,filter .15s,border-color .15s;}button:hover{transform:translateY(-1px);filter:brightness(1.08);border-color:rgba(192,132,252,.65);}button:active{transform:translateY(1px)}#randomBtn{background:linear-gradient(100deg,#2c173a,#5b247b);color:#ef8cff;}#copyHexBtn{border-color:rgba(65,200,255,.42);color:#59cbff;background:linear-gradient(180deg,#122239,#101726);}#copyBtn{border:0;color:#1b1223;background:linear-gradient(100deg,#f4cf7c 0%,#e3a0ed 48%,#5acbff 100%);}#resetBtn{color:#d7c8df;}#decodeBtn{min-height:58px;}.status{min-height:22px;margin-top:12px;color:var(--green);font-size:12px;}@media(max-width:900px){.layout{grid-template-columns:1fr}}@media(max-width:620px){body{padding:10px}.color-card{grid-template-columns:1fr}.color-control{grid-template-columns:1fr}.picker-label,.hex-label,input[type=color],.hex-input{grid-column:1}textarea{min-height:180px}.top-actions button{width:100%}}.preview-panel{margin-top:16px;padding:18px;}.preview-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;}.preview-title{margin:0;font-size:20px;font-weight:950;}.preview-controls{display:flex;gap:8px;flex-wrap:wrap;}.preview-controls select,.preview-controls button{min-height:40px;border:1px solid rgba(168,85,247,.36);border-radius:12px;padding:0 12px;color:#f6f2fb;background:#17131f;font-weight:800;}.pattern-tabs{display:flex;gap:7px}.pattern-tab{min-width:42px;padding:0;}.pattern-tab.active{border-color:#c084fc;background:linear-gradient(180deg,#61308b,#37204e);}.preview-stage{position:relative;min-height:410px;display:grid;place-i <style id="studio-layout-overrides">
body{
  padding:14px;
  overflow-x:hidden;
}
.app{
  width:min(1880px,100%);
}
.top-actions{
  padding-left:2px;
  margin-bottom:12px;
}
.layout{
  display:grid;
  grid-template-columns:minmax(360px,430px) minmax(500px,1fr) minmax(360px,430px);
  gap:14px;
  align-items:start;
}
.editor-panel,
.preview-panel,
.side{
  min-width:0;
}
.editor-panel{
  position:sticky;
  top:14px;
  max-height:calc(100vh - 28px);
  overflow:auto;
  scrollbar-width:thin;
}
.color-grid{
  gap:9px;
}
.color-card{
  min-height:86px;
  padding:11px;
  grid-template-columns:92px minmax(0,1fr);
}
.color-name{
  font-size:15px;
}
.color-control{
  grid-template-columns:minmax(110px,1fr) 116px;
  grid-template-rows:auto 42px;
  gap:5px 9px;
}
input[type=color],
.hex-input{
  height:42px;
}
.hex-input{
  padding:0 10px;
  font-size:11px;
}
.preview-panel{
  margin-top:0;
  padding:14px;
  position:sticky;
  top:14px;
  min-height:calc(100vh - 28px);
  display:flex;
  flex-direction:column;
}
.preview-head{
  margin-bottom:10px;
}
.preview-title{
  font-size:18px;
}
.preview-controls{
  justify-content:flex-end;
}
.preview-controls select,
.preview-controls button{
  min-height:36px;
  padding:0 10px;
  font-size:11px;
}
.preview-stage{
  flex:1;
  min-height:0;
  height:calc(100vh - 132px);
  border-radius:15px;
}
#dinoPreview{
  width:100%;
  height:100%;
  max-width:none;
  object-fit:contain;
}
.side{
  position:sticky;
  top:14px;
  max-height:calc(100vh - 28px);
  overflow:auto;
  scrollbar-width:thin;
}
.code-panel{
  padding:15px;
}
textarea{
  min-height:195px;
}
.creator-credit{
  margin-top:10px;
  padding-top:10px;
}
@media(max-width:1280px){
  .layout{
    grid-template-columns:minmax(330px,400px) minmax(420px,1fr) minmax(330px,390px);
  }
  .color-card{
    grid-template-columns:80px minmax(0,1fr);
  }
  .color-control{
    grid-template-columns:minmax(100px,1fr) 105px;
  }
}
@media(max-width:1050px){
  body{padding:10px}
  .layout{
    grid-template-columns:minmax(320px,390px) minmax(420px,1fr);
  }
  .side{
    grid-column:1/-1;
    position:static;
    max-height:none;
    overflow:visible;
    grid-template-columns:1fr 1fr;
  }
  .editor-panel,
  .preview-panel{
    position:static;
    max-height:none;
  }
  .preview-panel{
    min-height:680px;
  }
  .preview-stage{
    height:560px;
  }
}
@media(max-width:760px){
  .layout{
    grid-template-columns:1fr;
  }
  .side{
    grid-column:auto;
    grid-template-columns:1fr;
  }
  .preview-panel{
    min-height:auto;
  }
  .preview-stage{
    height:380px;
    min-height:380px;
  }
  .editor-panel,
  .side{
    overflow:visible;
  }
}
</style>

<style id="studio-layout-fixes">
/* Keep all three main columns aligned to the same bottom edge. */
.layout{
  align-items:stretch;
}
.editor-panel,
.preview-panel,
.side{
  position:static;
  top:auto;
  max-height:none;
  height:100%;
  overflow:visible;
}
.side{
  align-content:start;
}
.preview-panel{
  min-height:0;
}
.preview-stage{
  flex:1;
  height:auto;
  min-height:360px;
}

/* Give the labels room and make the pasted HEX field narrower. */
.color-card{
  grid-template-columns:88px minmax(0,1fr);
}
.color-control{
  grid-template-columns:minmax(92px,1fr) 94px;
  gap:5px 8px;
}
.hex-input{
  width:94px;
  min-width:0;
  padding:0 8px;
  font-size:10px;
}
.color-control-label{
  white-space:nowrap;
  font-size:8px;
  letter-spacing:.08em;
}
.hex-label{
  justify-self:center;
}

@media(max-width:1280px){
  .color-card{
    grid-template-columns:76px minmax(0,1fr);
  }
  .color-control{
    grid-template-columns:minmax(82px,1fr) 88px;
  }
  .hex-input{
    width:88px;
  }
}
@media(max-width:1050px){
  .editor-panel,
  .preview-panel,
  .side{
    height:auto;
  }
}
</style>

<style id="hex-control-balance-fix">
.color-control{
  grid-template-columns:minmax(120px,1fr) 112px !important;
  grid-template-rows:auto 48px !important;
  gap:7px 10px !important;
  align-items:stretch !important;
}
.color-control-label{
  display:block !important;
  width:100%;
  text-align:center;
  white-space:nowrap;
  overflow:visible;
  line-height:1.1;
}
.picker-label{
  grid-column:1 !important;
  grid-row:1 !important;
}
.hex-label{
  grid-column:2 !important;
  grid-row:1 !important;
}
input[type=color]{
  grid-column:1 !important;
  grid-row:2 !important;
  width:100% !important;
  height:48px !important;
  min-height:48px !important;
  border-radius:12px !important;
}
.hex-input{
  grid-column:2 !important;
  grid-row:2 !important;
  width:112px !important;
  height:48px !important;
  min-height:48px !important;
  padding:0 11px !important;
  border-radius:12px !important;
  font-size:11px !important;
}
@media(max-width:1280px){
  .color-control{
    grid-template-columns:minmax(104px,1fr) 104px !important;
  }
  .hex-input{
    width:104px !important;
  }
}
@media(max-width:620px){
  .color-control{
    grid-template-columns:1fr !important;
    grid-template-rows:auto 48px auto 48px !important;
  }
  .picker-label{
    grid-column:1 !important;
    grid-row:1 !important;
  }
  input[type=color]{
    grid-column:1 !important;
    grid-row:2 !important;
  }
  .hex-label{
    grid-column:1 !important;
    grid-row:3 !important;

  }

    width:100% !important;

</style>
</head><body><div class="app"><div class="top-actions"><button id="randomBtn">◇ Randomize All Colors</button><button id="copyHexBtn">▣ Copy All HEX</button></div><div class="layout"><section class="panel editor-panel"><h2 class="panel-heading"><span class="panel-icon">◌</span>Color Editor</h2><div id="pickers" class="color-grid"></div></section><section class="panel preview-panel"><div class="preview-head"><div><h2 class="preview-title">Stego Preview (Roughly - Not Exact but close enough :P)</h2><div class="preview-note">Pattern B</div></div><div class="preview-controls"><select id="dinoSelect" aria-label="Preview dinosaur" disabled><option value="stego">Stego Preview</option></select><div class="pattern-tabs"><button class="pattern-tab active" type="button" disabled>Pattern B</button></div><button id="originalPreviewBtn">Hold original</button><button id="savePreviewBtn">Save PNG</button></div></div><div class="preview-stage"><canvas id="dinoPreview"></canvas></div></section><aside class="side"><section class="panel code-panel"><div class="code-label"><label for="codeOut">Generated code</label><span>Updates automatically</span></div><textarea id="codeOut" spellcheck="false" readonly></textarea><div class="species-field"><label for="speciesSelect">Code species</label><select id="speciesSelect"><option value="0">Allosaurus</option><option value="1">Beipiaosaurus</option><option value="2">Carnotaurus</option><option value="3">Ceratosaurus</option><option value="4">Deinosuchus</option><option value="5">Diabloceratops</option><option value="6">Dilophosaurus</option><option value="7">Dryosaurus</option><option value="8">Gallimimus</option><option value="9">Herrerasaurus</option><option value="10">Hypsilophodon</option><option value="20">Kentrosaurus</option><option value="11">Maiasaura</option><option value="12">Omniraptor</option><option value="13">Pachycephalosaurus</option><option value="14">Pteranodon</option><option value="15" selected>Stegosaurus</option><option value="16">Tenontosaurus</option><option value="17">Triceratops</option><option value="18">Troodon</option><option value="19">Tyrannosaurus</option></select></div><div class="controls"><button id="copyBtn">Copy code</button><button id="resetBtn">Reset ↻</button></div><div id="copyStatus" class="status" aria-live="polite"></div></section><section class="panel code-panel"><div class="code-label"><label for="codeIn">Paste an existing code<br></label><span>Paste an ISL1 code</span></div><input id="codeIn" type="text" placeholder="ISL1...." spellcheck="false"><div class="controls"><button id="decodeBtn">Enter Pasted code</button></div><div id="decodeStatus" class="status" aria-live="polite"></div><div class="creator-credit">Made by <strong>&nbsp;Nickッ</strong></div></section></aside></div></div><script type="module" src="/src/app.js"></script></body></html>
